<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EJU耳勉 - 行知学園内部模擬 (第1回・第2回)</title>
  <style>
    :root {
      --bg-color: #f6f5f2;
      --card-bg: #ffffff;
      --text-main: #2c2c2c;
      --text-sub: #7a7a7a;
      --accent: #d9534f;
      --bar-bg: #1e2029;
      --star-active: #f5b942;
    }
    body.dark {
      --bg-color: #121318;
      --card-bg: #1e2028;
      --text-main: #e8e8e8;
      --text-sub: #9e9e9e;
      --bar-bg: #0d0e12;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 145px;
      transition: background 0.3s, color 0.3s;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--card-bg);
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .brand { display: flex; flex-direction: column; }
    .brand-title { font-size: 20px; font-weight: 800; color: #b7372a; letter-spacing: 0.5px; }
    .brand-sub { font-size: 11px; color: var(--text-sub); }
    .header-controls { display: flex; gap: 10px; align-items: center; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid rgba(128,128,128,0.25);
      background: var(--card-bg); color: var(--text-main);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px;
    }

    /* 双级联动导航黑条 */
    .nav-bar {
      background: #1a1c24;
      color: #fff;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
      gap: 8px;
    }
    .select-wrapper {
      display: flex; align-items: center; gap: 8px; flex: 1; overflow: hidden;
    }
    .set-select, .question-select {
      background: #fff; color: #222;
      border: none; padding: 6px 10px;
      border-radius: 18px; font-weight: 700; font-size: 13px;
      cursor: pointer; outline: none;
    }
    .set-select { background: #ffefc2; color: #7a4f01; flex-shrink: 0; }
    .question-select { flex: 1; max-width: 210px; }
    .filter-star-btn {
      background: #fff; border: none; border-radius: 18px;
      padding: 4px 12px; cursor: pointer; font-size: 16px; flex-shrink: 0;
    }
    .filter-star-btn.active { background: #fff3cd; }

    /* 提示气泡 */
    .top-banner {
      max-width: 680px; margin: 12px auto 4px; padding: 0 16px;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    }
    .question-prompt {
      font-size: 13px; color: var(--text-sub); line-height: 1.5; flex: 1;
    }
    .toast-tip {
      background: #4a4a4a; color: #fff; font-size: 12px;
      padding: 6px 12px; border-radius: 8px; white-space: nowrap;
    }

    /* 单词卡片列表 */
    .container { max-width: 680px; margin: 0 auto; padding: 8px 16px; }
    .vocab-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px 16px;
      margin-bottom: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      border: 1px solid rgba(128,128,128,0.1);
    }
    .vocab-left {
      display: flex; align-items: center; gap: 12px; flex: 1;
    }
    .kana {
      font-size: 17px; font-weight: 700; min-width: 122px;
    }
    .tts-btn {
      width: 28px; height: 28px; border-radius: 50%;
      border: 1.5px solid #d4878f; background: rgba(212, 135, 143, 0.1);
      color: #c95b66; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 13px; flex-shrink: 0;
    }
    .tts-btn:active { transform: scale(0.92); }
    .meaning-box {
      cursor: pointer; user-select: none; flex: 1; padding-left: 6px;
    }
    .kanji { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
    .meaning { font-size: 13.5px; color: var(--text-sub); }
    .dots {
      font-size: 20px; color: #8aa69b; letter-spacing: 4px; font-weight: bold;
    }
    .meaning-box.hidden .kanji,
    .meaning-box.hidden .meaning { display: none; }
    .meaning-box:not(.hidden) .dots { display: none; }

    .star-btn {
      background: none; border: none; font-size: 22px;
      color: #b0b0b0; cursor: pointer; padding: 4px;
    }
    .star-btn.starred { color: var(--star-active); }

    /* 原文与答案折叠区 */
    .eju-extra {
      margin-top: 18px; background: var(--card-bg);
      border-radius: 12px; padding: 16px;
      border: 1px solid rgba(128,128,128,0.15);
    }
    .extra-btns { display: flex; gap: 10px; flex-wrap: wrap; }
    .toggle-btn {
      padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(128,128,128,0.3);
      background: transparent; color: var(--text-main); font-size: 13px;
      cursor: pointer; font-weight: 600;
    }
    .extra-content {
      margin-top: 14px; padding-top: 14px;
      border-top: 1px dashed rgba(128,128,128,0.2);
      font-size: 14.5px; line-height: 1.8; display: none;
      white-space: pre-wrap;
    }
    .extra-content.show { display: block; }
    .answer-badge {
      display: inline-block; background: #2b7a4b; color: #fff;
      padding: 3px 10px; border-radius: 6px; font-weight: bold;
    }

    /* 底部固定播放器 */
    .bottom-dock {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--bar-bg); color: #fff; z-index: 30;
    }
    .sub-dock {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 20px; background: #262936; font-size: 13px; color: #ccc;
    }
    .sub-dock span { cursor: pointer; user-select: none; }
    .progress-wrap {
      padding: 6px 20px 0; display: flex; align-items: center; gap: 10px; font-size: 11px; color: #aaa;
    }
    .progress-bar { flex: 1; accent-color: #fff; cursor: pointer; height: 4px; }
    .player-controls {
      display: flex; justify-content: space-around; align-items: center;
      padding: 10px 16px 18px; max-width: 600px; margin: 0 auto;
    }
    .ctrl-btn {
      background: none; border: none; color: #fff;
      font-size: 16px; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 8px;
    }
    .play-btn { font-size: 28px; width: 54px; height: 54px; }
    .speed-btn { background: #2c2f3b; font-size: 14px; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-title">EJU耳勉</div>
      <div class="brand-sub">EJU Listening · 行知学園内部模擬</div>
    </div>
    <div class="header-controls">
      <button class="icon-btn" id="toggleAllMeaningBtn" title="全部显示/隐藏释义">👁️</button>
      <button class="icon-btn" id="themeBtn" title="切换夜间模式">🌙</button>
    </div>
  </header>

  <div class="nav-bar">
    <div class="select-wrapper">
      <select class="set-select" id="setSelect"></select>

    <button class="filter-star-btn" id="filterStarBtn" title="只看本题收藏生词">⭐</button>
  </div>

  <div class="top-banner">
    <div class="question-prompt" id="questionIntro"></div>
    <div class="toast-tip">耳朵预热，而后听题</div>
  </div>

  <div class="container">
    <div id="vocabList"></div>

    <div class="eju-extra">

      </div>
      <div class="extra-content" id="scriptBox"></div>
      <div class="extra-content" id="answerBox"></div>
    </div>
  </div>

  <div class="bottom-dock">
    <div class="sub-dock">
      <span id="prevQBtn">⬅️ 上一题</span>
      <span id="audioStatus">就绪</span>
      <span id="nextQBtn">下一题 ➡️</span>

    <div class="progress-wrap">
      <span id="curTime">00:00</span>

      <span id="durTime">00:00</span>
    </div>
    <div class="player-controls">
      <button class="ctrl-btn" id="resetBtn" title="重头播放">✕</button>
      <button class="ctrl-btn" id="rewBtn" title="后退5秒">↺ 5</button>
      <button class="ctrl-btn play-btn" id="playBtn">▶</button>
      <button class="ctrl-btn" id="fwdBtn" title="前进5秒">5 ↻</button>
      <button class="ctrl-btn speed-btn" id="speedBtn">1x</button>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    // === 题库总表：按“回数”分组管理 ===
    const EJU_SETS = [
      {
        setId: "set01",
        setName: "第1回 (全27題)",
        questions: [
          {
            id: "0101", title: "聴読解 1番", audio: "0101.mp3", answer: "④ (解答番号 1)",
            intro: "先生が、情報教育について話しています。この先生が最後にする質問の答えはどれですか。",
            script: `情報化社会が進展していく中で、情報教育の重要性は今後ますます高まっていくと考えられます。そこで、今日は、情報について何を学べばよいのか、ということについてお話ししたいと思います。\n情報教育は大きく4つに分けることができます。第1は、新聞やテレビなど、いろいろなメディアの特性を知ることです。第2は、どんなときにどのメディアを使ったらいいか判断できるようにすることです。これは第1の内容の応用編と言っていいでしょう。第3は、メディアが私たちの暮らしや社会にどんな影響を与えているかを学ぶことです。特に普段意識されることのない隠れた影響について知ることが大切です。そして第4は、メディア社会で安全に行動するにはどうしたらいいかを理解することです。\nでは、自分の個人情報がネット上に拡散してしまわないようにするためには、何を学べばよいでしょうか。`,
            vocab: [
              { kana: "しんてん", kanji: "進展", meaning: "进展，发展" },
              { kana: "じゅうようせい", kanji: "重要性", meaning: "重要性" },
              { kana: "とくせい", kanji: "特性", meaning: "特性，特征" },
              { kana: "おうようへん", kanji: "応用編", meaning: "应用篇" },
              { kana: "えいきょう", kanji: "影響", meaning: "影响" },
              { kana: "いしき", kanji: "意識", meaning: "意识，察觉" },
              { kana: "こじんじょうほう", kanji: "個人情報", meaning: "个人信息" },
              { kana: "かくさん", kanji: "拡散", meaning: "扩散，散播" }
            ]
          },
          {
            id: "0102", title: "聴読解 2番", audio: "0102.mp3", answer: "③ (解答番号 2)",
            intro: "先生がマーケティングの授業で価格戦略について話しています。この先生が最後にする質問の答えはどれですか。",
            script: `商品をたくさん売るためには、商品の価格をどのように決めればいいのでしょうか。今日は4つの考え方についてお話しします。\n1つ目は威光効果というものです。これは、価格は高ければ高いほどよい、それを買うことで自分の価値も上がるという人の心理を利用したもので、高ければ高いほど売れるという、通常とは逆の購買行動を引き起こします。次に、端数効果というものがあります。これは皆さんもよく見かけるでしょう。値段を3000円とするよりも、そこからほんの少し値引きした価格にしたほうが、お得な感じがするという心理を利用しています。それから、習慣効果というのもあります。自動販売機の缶コーヒーは130円で売られていることが多いので、人々はこの価格設定に慣れています。そこで、110円で缶コーヒーを売り出すと、みんな「安い」と感じてつい買ってしまうのです。そのほかにも、1つだと398円だけれど3つで1000円というような売り方をする場合もあり、これは抱き合わせという戦略です。\nでは、こんな例を考えてみましょう。あるコンビニエンスストアで、140円でパンを売ろうとしたら売れなかったので、売れない理由を調べに売り場に行ってみました。するとお店に並んでいるパンは110円から130円という価格帯のものばかりでした。そこで売りたいパンの値段を120円にしたら売れるようになりました。このケースでは、どのような価格戦略が成功したと言えるでしょうか。`,
            vocab: [
              { kana: "かかくせんりゃく", kanji: "価格戦略", meaning: "价格战略/定价策略" },
              { kana: "いこうこうか", kanji: "威光効果", meaning: "威光效应（声望定价）" },
              { kana: "こうばいこうどう", kanji: "購買行動", meaning: "购买行为" },
              { kana: "はすうこうか", kanji: "端数効果", meaning: "尾数效应（零头定价）" },
              { kana: "ねびき", kanji: "値引き", meaning: "降价，打折" },
              { kana: "しゅうかんこうか", kanji: "習慣効果", meaning: "习惯效应" },
              { kana: "だきあわせ", kanji: "抱き合わせ", meaning: "捆绑销售，搭配销售" },
              { kana: "かかくたい", kanji: "価格帯", meaning: "价格带，价格区间" }

          },
          {
            id: "0103", title: "聴読解 3番", audio: "0103.mp3", answer: "③ (解答番号 3)",
            intro: "女子学生と男子学生が大学の体育の授業について話しています。この女子学生が体育の第2希望として申し込むのはどれですか。",
            script: `女子学生：大学に入ってまで体育をやらなきゃいけないなんて、いやね。\n男子学生：なんで？ 体を動かせていいじゃない。自分の好きなスポーツを選べるんだしさ。\n女子学生：私は文学部キャンパスでできるものにするわ。移動するのいやだから。\n男子学生：僕はちゃんと体を動かすものにしたいな。\n女子学生：私は弓道にしとこうかな。\n男子学生：弓道人気あるみたいだから、第2希望もちゃんと考えておいたほうがいいよ。\n女子学生：そうなんだ。どれにしようかな。\n男子学生：これにしたら？ 文学部の体育館だよ。\n女子学生：私、球技苦手なのよ。\n男子学生：じゃあ、これは？ ボール使わないよ。\n女子学生：うーん。それも苦手だけど、仕方ないわね。第2希望はそれにしておくわ。`,
            vocab: [
              { kana: "たいいく", kanji: "体育", meaning: "体育" },
              { kana: "いどう", kanji: "移動", meaning: "移动，换校区" },
              { kana: "きゅうどう", kanji: "弓道", meaning: "弓道（日本射箭）" },
              { kana: "だいにきぼう", kanji: "第2希望", meaning: "第二志愿" },
              { kana: "たいいくかん", kanji: "体育館", meaning: "体育馆" },
              { kana: "きゅうぎ", kanji: "球技", meaning: "球类运动" },
              { kana: "にがて", kanji: "苦手", meaning: "不擅长，发怵" },
              { kana: "しかたない", kanji: "仕方ない", meaning: "没办法，不得已" }
            ]
          },
          {
            id: "0104", title: "聴読解 4番", audio: "0104.mp3", answer: "② (解答番号 4)",
            intro: "先生が授業でカニについて話しています。この先生が今日特に詳しく取り上げるのは、どのカニですか。",
            script: `カニといえばみんな横歩きしかできない、と思う人も多いかもしれませんが、前や後ろに進むことのできるカニもいます。まず、横歩きしかできないカニとしては、陸に棲むイワガニやイソガニ、あるいは河口や干潟に棲むアカテガニやベンケイガニなどが挙げられます。ハサミが体に対して大きすぎることが、前に進む邪魔をしています。\n一方、海の深いところに棲んでいるケアシガニやタカアシガニは、比較的自由に動く細長い脚を使って、横はもちろん前にも後ろにも移動することができます。細長い脚で自分の体を持ち上げることによって、海底の複雑な地形を動き回ることが可能となっているのです。ケアシガニとタカアシガニの区別は比較的簡単です。毛や棘がいっぱい生えているのがケアシガニ、ないのがタカアシガニです。今日は横歩き以外にも移動ができるカニについて詳しくお話ししたいと思います。`,
            vocab: [
              { kana: "よこあるき", kanji: "横歩き", meaning: "横着走" },
              { kana: "りくにすむ", kanji: "陸に棲む", meaning: "栖息在陆地上" },

              { kana: "はさみ", kanji: "ハサミ", meaning: "蟹钳，螯" },
              { kana: "じゃま", kanji: "邪魔", meaning: "妨碍，阻碍" },
              { kana: "ほそながい", kanji: "細長い", meaning: "细长的" },
              { kana: "とげ", kanji: "棘", meaning: "刺，棘刺" }
            ]
          },
          {
            id: "0105", title: "聴読解 5番", audio: "0105.mp3", answer: "① (解答番号 5)",
            intro: "先生が、ニュース原稿の書き方について説明しています。この先生が特に重要と言っているのはどこですか。",
            script: `ニュース番組で使う原稿は、よく整理されている必要があります。内容を整理しないまま報道してしまうと、視聴者は「あれ、今、何の話だっけ？」と、困惑してしまうからです。\nでは、ニュース原稿はどのように整理されているのでしょうか。実はニュース原稿は、大きく4つの部分から構成されています。はじめにタイトルやリードと呼ばれる短い文や文章があり、次に詳しい内容、それからニュースの背景となる事柄、最後に今後の見通し、という順番で構成されているのです。わかりやすいニュース原稿にするためには、話題をはっきり示すことが必要不可欠です。話題を把握することで、視聴者のほうも話を聞く心構えができるからです。`,

              { kana: "ことがら", kanji: "事柄", meaning: "事情，事项" },
              { kana: "みとおし", kanji: "見通し", meaning: "展望，预测，前景" },
              { kana: "ひつようふかけつ", kanji: "必要不可欠", meaning: "必不可少" },
              { kana: "こころがまえ", kanji: "心構え", meaning: "心理准备，思想准备" }
            ]
          },
          {

              { kana: "にょう", kanji: "尿", meaning: "尿液" },
              { kana: "まぬがれる", kanji: "免れる", meaning: "免于，逃脱" }
            ]
          },
          {
            id: "0222", title: "聴解 22番", audio: "0222.mp3", answer: "③ (解答番号 22)",
            intro: "先生が、スポーツの選び方について話しています。この先生は、どのようにスポーツを選ぶべきだと言っていますか。",
            script: `スポーツを薬にたとえる考え方があります。患者の病状に合わせて薬を選ぶのと同様に、人の体の状態に合わせて、適切なスポーツを選ぶという考え方です。しかし、私はこの考え方には賛成できません。なぜなら、薬はやむをえずその力を借りるもので、日常的に用いるものではないからです。本来、スポーツとはそのようなものではありません。\n私はスポーツは食事にたとえたほうがいいのではないかと思います。食事のメニューを選ぶとき、基本的には、自分の好きなものやおいしそうなものを選べばよいのですが、同時に栄養のバランスを考えて、不足しているものを食べようと考えます。これと同様に、スポーツを選ぶときにも、不足しているものの強化という観点から選ぶべきだと思います。\n\n【選択肢】\n1. 自分の好きな、あるいは面白そうなスポーツを選ぶ。\n2. 病気の予防に効果的なスポーツを選ぶ。\n3. 健康にとって足りない要素を補うスポーツを選ぶ。\n4. 毎日苦しむことなく続けられるスポーツを選ぶ。`,
            vocab: [
              { kana: "たとえる", kanji: "たとえる", meaning: "比作，比喻" },
              { kana: "びょうじょう", kanji: "病状", meaning: "病情，症状" },
              { kana: "やむをえず", kanji: "やむをえず", meaning: "迫不得已" },
              { kana: "かんてん", kanji: "観点", meaning: "观点，角度" },
              { kana: "おぎなう", kanji: "補う", meaning: "补充，弥补" }
            ]
          },
          {
            id: "0223", title: "聴解 23番", audio: "0223.mp3", answer: "② (解答番号 23)",
            intro: "男子学生と女子学生が、ボールペンについて話しています。この男子学生の話によると、新しいボールペンは、従来のボールペンとどう違うのですか。",
            script: `男子学生：ボールペンのボールって何だか知ってる？\n女子学生：そう言われてみたら、知らないわ。\n男子学生：文字通り、ボールだよ。ボールペンの先には、小さな金属のボールがついてるんだ。\n女子学生：へえ。\n男子学生：そのボールがインクを紙に運ぶんだけど、インクとボールの間に隙間ができると字が書けなくなるという弱点があるんだ。\n女子学生：たしかにそうね。先を上に向けて書いてると、インクが出てこなくなったことがあったけど、そういうわけだったのね。\n男子学生：うん。そこでインクの芯の空気圧を高めて、常にインクがボールに向かうようにした、加圧ボールペンが開発されたんだ。\n女子学生：私が持ってるのもそうなのか、後で試してみるわ。\n\n【選択肢】\n1. インクが濃い。\n2. 逆さにしても字が書ける。\n3. インクの減りが遅い。\n4. ボールがついていない。`,
            vocab: [
              { kana: "じゅうらい", kanji: "従来", meaning: "以往，传统，旧有" },
              { kana: "もじどおり", kanji: "文字通り", meaning: "正如字面意思" },
              { kana: "すきま", kanji: "隙間", meaning: "缝隙，空隙" },
              { kana: "しん", kanji: "芯", meaning: "笔芯" },
              { kana: "かあつ", kanji: "加圧", meaning: "加压" },
              { kana: "さかさ", kanji: "逆さ", meaning: "倒过来，颠倒" }
            ]
          },
          {
            id: "0224", title: "聴解 24番", audio: "0224.mp3", answer: "④ (解答番号 24)",
            intro: "先生が、心理学の授業で話しています。この先生は、人の名前が思い出せないときの解消法として、どのような方法をすすめていますか。",
            script: `皆さんも、人の名前やものの名前が思い出せそうで思い出せない、という経験が一度はあると思います。脳科学の研究によれば、記憶には、覚えやすい記憶と覚えにくい記憶とがあり、名前は覚えにくい記憶に分類されるということです。ですから、名前が出てこないというのは、仕方のないことかもしれません。\nでも、思い出せないままでは気持ちが悪いですね。多くの人が行うのが、いわゆる「あいうえお検索」ではないでしょうか。「あ」から順に、脳の中で名前を検索していくのです。頭文字がわかれば約5割の人が思い出せるという研究結果もあるくらいですから、理にかなってはいるのですが、効率が悪いですね。そこで、私がおすすめしたいのが、連想記憶法です。記憶は、一つひとつ別々に覚えているのではなく、かたまりで覚えているものですから、思い出したい名前と一緒に記憶されている情報を掘り起こすことで、それにつられて名前が出てくるのです。\n\n【選択肢】\n1. 知り合いの名前をできるだけ多く紙に書き出す。\n2. 「あ」から順に、思い出したい名前が出てくるまで探す。\n3. 思い出すのをいったんやめて、ひらめくのを待つ。\n4. 名前を思い出したい人の周辺情報を思い出す。`,
            vocab: [
              { kana: "かいしょうほう", kanji: "解消法", meaning: "消除方法，解决办法" },
              { kana: "かしらもじ", kanji: "頭文字", meaning: "首字母，开头假名" },
              { kana: "りにかなう", kanji: "理にかなう", meaning: "合乎情理，合乎逻辑" },
              { kana: "れんそうきおくほう", kanji: "連想記憶法", meaning: "联想记忆法" },
              { kana: "かたまり", kanji: "かたまり", meaning: "团，块，整体" },
              { kana: "ほりおこす", kanji: "掘り起こす", meaning: "挖掘出，唤醒" },
              { kana: "ひらめく", kanji: "ひらめく", meaning: "灵光一闪" }
            ]
          },
          {
            id: "0225", title: "聴解 25番", audio: "0225.mp3", answer: "② (解答番号 25)",
            intro: "講師が、人と打ち解ける方法について話しています。この講師が、特にすすめている方法の具体例として適当なものはどれですか。",
            script: `人と打ち解けるためには、自分を積極的にアピールすることが必要です。そのときに使えるのが、セルフ・プレゼンテーションというテクニックです。自分が考えた企画や提案を他者に売り込むことを、プレゼンテーションと言いますが、ここで売り込む対象は自分自身です。具体的には、自分がどういう人間で、どういう長所があるのかなどを、会話の中でさりげなく相手に伝えます。そうすることで相手はあなたに興味を持ち、自然と打ち解けることができます。その際、特におすすめなのが、自分の欠点をさらけ出すことです。あまり話したくない事柄を相手と共有することで、ぐっと親密度が高まるのです。\n\n【選択肢】\n1. 相手の好きなものを詳しく聞き出す。\n2. 自分の過去の失敗談を打ち明ける。\n3. 自分のほうから積極的に趣味について語る。\n4. 相手の話にできるだけ共感するようにする。`,
            vocab: [
              { kana: "うちとける", kanji: "打ち解ける", meaning: "消除隔阂，打成一片" },
              { kana: "うりこむ", kanji: "売り込む", meaning: "推销，宣传" },
              { kana: "さりげなく", kanji: "さりげなく", meaning: "若无其事地，不经意间" },
              { kana: "さらけだす", kanji: "さらけ出す", meaning: "暴露，毫无保留地坦露" },
              { kana: "しんみつど", kanji: "親密度", meaning: "亲密度" },
              { kana: "うちあける", kanji: "打ち明ける", meaning: "坦白，倾诉" }
            ]
          },
          {
            id: "0226", title: "聴解 26番", audio: "0226.mp3", answer: "② (解答番号 26)",
            intro: "先生が、ファッション商品を売る店について話しています。この先生は、これからのお店はどうあるべきだと言っていますか。",
            script: `ファッション商品を売るお店が、消費者の満足を得るにはどうしたらよいでしょうか。近頃のファッションの消費者は、一人ひとり異なった感性や好みを持ち、個性豊かです。また、商品を選択する目を持っているため、自分の感性でお店を使い分けています。ですから、お店は、どのような消費者の、どのようなニーズに応えるのか、その店独自のショップコンセプトを持っていなければなりません。ショップコンセプトというと、どのような商品を売るのかといった点に目が行きがちですが、それだけでなく、どのような接客をするのか、あるいはどのような店の空間にするのか、といった点も重要です。\n\n【選択肢】\n1. いい品物をできるだけ安く提供する。\n2. ほかにはないその店らしさを作り上げる。\n3. 心地よい接客に特に力を入れる。\n4. あらゆる消費者に対応できる店にする。`,
            vocab: [
              { kana: "かんせい", kanji: "感性", meaning: "感性，审美品味" },
              { kana: "つかいわける", kanji: "使い分ける", meaning: "区分使用，按需选择" },
              { kana: "こたえる", kanji: "応える", meaning: "回应，满足（需求）" },
              { kana: "せっきゃく", kanji: "接客", meaning: "待客，接待顾客" },
              { kana: "ここちよい", kanji: "心地よい", meaning: "舒适的，令人愉快的" }
            ]
          },
          {
            id: "0227", title: "聴解 27番", audio: "0227.mp3", answer: "③ (解答番号 27)",
            intro: "講師が、子どものうそについて話しています。この講師は、子どものうそについてどう考えていますか。",
            script: `子どもは3歳ころからうそをつき始め、小学校低学年ころに最もその傾向が激しくなるとされています。それは一般的なことではあるのですが、やはり親としては、子どものうそが多いと心配になってしまいます。\nしかし、知的能力の点から言えば、心配しすぎることはありません。むしろ、うそがつけないような子よりも、うそをつける子のほうが、はるかに創造性が高いと言えます。というのも、うそは自分が経験していないことがらを、あたかも経験したかのように話すことだからです。もちろん、自分の失敗をごまかしたり、他人に迷惑をかけるようなうそは厳しく注意しなくてはなりませんが、それ以外のうそは、大いに楽しんで聞いてあげてほしいと思います。\n\n【選択肢】\n1. 小さいころから、うそはいけないと教えなければならない。\n2. 何とかして責任から逃れようとする人間的本能の表れである。\n3. 創造的な能力の表れであるから、寛容であるべきだ。\n4. うそはいけないことだが、自然なことなので放っておけばよい。`,
            vocab: [
              { kana: "けいこう", kanji: "傾向", meaning: "倾向，趋势" },
              { kana: "そうぞうせい", kanji: "創造性", meaning: "创造力，创造性" },
              { kana: "ごまかす", kanji: "ごまかす", meaning: "掩饰，蒙混" },
              { kana: "のがれる", kanji: "逃れる", meaning: "逃避，逃脱" },
              { kana: "かんよう", kanji: "寛容", meaning: "宽容，大度" }
            ]
          }
        ]
      }
    ];

    // === 状态管理 ===
    let currentSetIdx = 0;
    let currentQIdx = 0;
    let showAllMeaning = false;
    let onlyStarred = false;
    let starredMap = JSON.parse(localStorage.getItem('eju_starred_vocab') || '{}');
    const speeds = [0.8, 1.0, 1.2, 1.5];
    let speedIdx = 1;

    // === DOM 元素 ===
    const setSelect = document.getElementById('setSelect');
    const questionSelect = document.getElementById('questionSelect');
    const questionIntro = document.getElementById('questionIntro');
    const vocabListEl = document.getElementById('vocabList');
    const scriptBox = document.getElementById('scriptBox');
    const answerBox = document.getElementById('answerBox');
    const audioPlayer = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const progressBar = document.getElementById('progressBar');
    const curTimeEl = document.getElementById('curTime');
    const durTimeEl = document.getElementById('durTime');
    const audioStatus = document.getElementById('audioStatus');

    // === 初始化双下拉菜单 ===
    function initMenus() {
      setSelect.innerHTML = EJU_SETS.map((s, idx) =>
        `<option value="${idx}">${s.setName}</option>`
      ).join('');

      setSelect.addEventListener('change', (e) => {
        currentSetIdx = parseInt(e.target.value, 10);
        populateQuestionSelect();
        loadQuestion(0);
      });

      questionSelect.addEventListener('change', (e) => {
        loadQuestion(parseInt(e.target.value, 10));
      });

      populateQuestionSelect();
    }

    function populateQuestionSelect() {
      const qs = EJU_SETS[currentSetIdx].questions;
      questionSelect.innerHTML = qs.map((item, idx) =>
        `<option value="${idx}">${item.id} · ${item.title}</option>`
      ).join('');
    }

    // === 加载当前回数的指定题目 ===
    function loadQuestion(qIdx) {
      const qs = EJU_SETS[currentSetIdx].questions;
      if (qIdx < 0 || qIdx >= qs.length) return;
      currentQIdx = qIdx;
      const data = qs[qIdx];
      questionSelect.value = qIdx;
      questionIntro.textContent = data.intro;

      scriptBox.classList.remove('show');
      answerBox.classList.remove('show');
      scriptBox.textContent = data.script;
      answerBox.innerHTML = `本题正答：<span class="answer-badge">${data.answer}</span>`;

      audioPlayer.src = data.audio;
      audioPlayer.playbackRate = speeds[speedIdx];
      playBtn.textContent = '▶';
      audioStatus.textContent = `${data.audio} (${qIdx + 1}/${qs.length})`;

      renderVocab();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // === 渲染单词卡片 ===
    function renderVocab() {
      const data = EJU_SETS[currentSetIdx].questions[currentQIdx];
      const list = data.vocab.filter((v) => {
        const key = `${data.id}_${v.kana}`;
        return !onlyStarred || starredMap[key];
      });

      if (list.length === 0) {
        vocabListEl.innerHTML = `<div style="text-align:center;padding:30px;color:var(--text-sub);">本题暂无收藏的生词</div>`;
        return;
      }

      vocabListEl.innerHTML = list.map((v, i) => {
        const key = `${data.id}_${v.kana}`;
        const isStarred = !!starredMap[key];
        const hideClass = (i === 0 || showAllMeaning) ? '' : 'hidden';
        const cleanKana = v.kana.replace(/〜|・/g, ' ');
        return `
          <div class="vocab-card">
            <div class="vocab-left">
              <div class="kana">${v.kana}</div>
              <button class="tts-btn" onclick="speakJapanese('${cleanKana}')" title="点击发音">♪</button>
              <div class="meaning-box ${hideClass}" onclick="this.classList.toggle('hidden')">
                <div class="kanji">${v.kanji}</div>
                <div class="meaning">${v.meaning}</div>
                <div class="dots">・・・</div>
              </div>
            </div>
            <button class="star-btn ${isStarred ? 'starred' : ''}" onclick="toggleStar('${key}', this)">
              ${isStarred ? '★' : '☆'}
            </button>
          </div>
        `;
      }).join('');
    }

    // === 在线真人词典语音流 + 本地自然语音兜底 ===
    const wordAudio = new Audio();
    let jpVoice = null;

    function loadBestJapaneseVoice() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      jpVoice = voices.find(v => v.lang.includes('ja') && v.name.includes('Nanami')) ||
                voices.find(v => v.lang.includes('ja') && v.name.includes('Keita')) ||
                voices.find(v => v.lang.includes('ja') && v.name.includes('Natural')) ||
                voices.find(v => v.lang.includes('ja') && v.name.includes('Google')) ||
                voices.find(v => v.lang.includes('ja') && (v.name.includes('Kyoko') || v.name.includes('Otoya'))) ||
                voices.find(v => v.lang.includes('ja'));
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadBestJapaneseVoice;
      loadBestJapaneseVoice();
    }

    function fallbackLocalSpeech(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      if (!jpVoice) loadBestJapaneseVoice();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ja-JP';
      if (jpVoice) utter.voice = jpVoice;
      utter.rate = 1.0;
      window.speechSynthesis.speak(utter);
    }

    function speakJapanese(text) {
      const url = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(text)}&le=jap`;
      wordAudio.pause();
      wordAudio.src = url;
      wordAudio.play().catch(() => {
        fallbackLocalSpeech(text);
      });
    }

    // === 收藏切换 ===
    function toggleStar(key, btnEl) {
      if (starredMap[key]) {
        delete starredMap[key];
        btnEl.classList.remove('starred');
        btnEl.textContent = '☆';
      } else {
        starredMap[key] = true;
        btnEl.classList.add('starred');
        btnEl.textContent = '★';
      }
      localStorage.setItem('eju_starred_vocab', JSON.stringify(starredMap));
      if (onlyStarred) renderVocab();
    }

    // === 按钮事件 ===
    document.getElementById('toggleAllMeaningBtn').addEventListener('click', () => {
      showAllMeaning = !showAllMeaning;
      renderVocab();
    });

    document.getElementById('themeBtn').addEventListener('click', (e) => {
      document.body.classList.toggle('dark');
      e.target.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
    });

    document.getElementById('filterStarBtn').addEventListener('click', (e) => {
      onlyStarred = !onlyStarred;
      e.target.classList.toggle('active', onlyStarred);
      renderVocab();
    });

    document.getElementById('prevQBtn').addEventListener('click', () => {
      if (currentQIdx > 0) loadQuestion(currentQIdx - 1);
    });
    document.getElementById('nextQBtn').addEventListener('click', () => {
      const qs = EJU_SETS[currentSetIdx].questions;
      if (currentQIdx < qs.length - 1) loadQuestion(currentQIdx + 1);
    });

    document.getElementById('toggleScriptBtn').addEventListener('click', () => {
      scriptBox.classList.toggle('show');
    });
    document.getElementById('toggleAnswerBtn').addEventListener('click', () => {
      answerBox.classList.toggle('show');
    });

    // === 音频播放器控制 ===
    function formatTime(sec) {
      if (!sec || isNaN(sec)) return '00:00';
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    playBtn.addEventListener('click', () => {
      if (audioPlayer.paused) {
        audioPlayer.play().catch(() => {
          const curAudio = EJU_SETS[currentSetIdx].questions[currentQIdx].audio;
          audioStatus.textContent = `未找到音频 ${curAudio}`;
        });
      } else {
        audioPlayer.pause();
      }
    });

    audioPlayer.addEventListener('play', () => playBtn.textContent = '⏸');
    audioPlayer.addEventListener('pause', () => playBtn.textContent = '▶');
    audioPlayer.addEventListener('loadedmetadata', () => {
      progressBar.max = audioPlayer.duration || 0;
      durTimeEl.textContent = formatTime(audioPlayer.duration);
    });
    audioPlayer.addEventListener('timeupdate', () => {
      progressBar.value = audioPlayer.currentTime;
      curTimeEl.textContent = formatTime(audioPlayer.currentTime);
    });

    progressBar.addEventListener('input', (e) => {
      audioPlayer.currentTime = parseFloat(e.target.value);
    });

    document.getElementById('rewBtn').addEventListener('click', () => {
      audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 5);
    });
    document.getElementById('fwdBtn').addEventListener('click', () => {
      audioPlayer.currentTime = Math.min(audioPlayer.duration || 0, audioPlayer.currentTime + 5);
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      audioPlayer.pause();
      audioPlayer.currentTime = 0;
    });
    document.getElementById('speedBtn').addEventListener('click', (e) => {
      speedIdx = (speedIdx + 1) % speeds.length;
      audioPlayer.playbackRate = speeds[speedIdx];
      e.target.textContent = `${speeds[speedIdx]}x`;
    });

    initMenus();
    loadQuestion(0);
  </script>
</body>
</html>
